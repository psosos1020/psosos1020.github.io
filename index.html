<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ACP 재단 - Azoral, Contain, Porn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Firebase SDK: Firestore만 사용 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { background:#222; color:#eee; font-family:'Malgun Gothic', Arial, sans-serif; margin:0; }
    header { background:#111; padding:24px 0 10px; text-align:center; border-bottom:4px solid #f44; }
    header h1{ margin:0; font-size:2.3em; }
    header h2{ margin:11px 0 0 0; color:#f44; font-size:1.1em;}
    .container { max-width:900px; margin:30px auto; padding:24px; background:#292929; border-radius:8px; }
    .hidden { display:none; }
    nav { background:#191919; padding:7px 0; text-align:center; border-bottom:2px solid #444; }
    nav button { background:none; border:none; color:#f44; margin:0 10px; font-size:1.1em; cursor:pointer; }
    .board-post, .comment { background:#181818; margin:18px 0; padding:14px 12px; border-left:5px solid #f44; border-radius:6px; }
    .board-post .title { font-size:1.18em; color:#fff; margin-bottom:7px;}
    .like-btn { cursor:pointer; color:#f44; background:none; border:none; font-size:1.1em; }
    .like-btn.liked { color:#ffd700; }
    .comment { margin-left:30px; border-left:3px solid #4af; }
    .profile-box { margin:20px 0; padding:15px; background:#181818; border-radius:8px; }
    input, textarea { background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:6px 8px; margin-bottom:8px; }
    .login-box, .signup-box { margin:30px auto 0 auto; max-width:350px; background:#191919; padding:20px 22px; border-radius:10px; }
    .btn { background:#f44; color:#fff; border:none; padding:7px 15px; border-radius:5px; cursor:pointer; }
    .btn:disabled { background:#555; }
    .err { color:#f44; margin:7px 0; }
    .info { color:#4af; margin:7px 0; }
    label { display:block; margin-bottom:6px; color:#ddd; font-size:0.95em; }
    /* 모달 간단 스타일 */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal { background:#1e1e1e; padding:20px; border-radius:8px; width:320px; box-shadow:0 6px 24px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <header>
    <h1>ACP 재단</h1>
    <h2>아조랄, 격리, 포르노</h2>
  </header>

  <nav id="navbar">
    <button onclick="showPage('board')">게시판</button>
    <button onclick="showPage('profile')">프로필</button>
  </nav>

  <div class="container">
    <!-- 닉네임이 없는 경우 강제 모달로 설정 -->
    <!-- 게시판 -->
    <div id="board-page">
      <h3>게시판</h3>
      <div class="info">현재 닉네임: <b id="current-nickname">-</b> <button class="btn" onclick="showSetNick()">닉네임 변경</button></div>
      <form id="post-form" onsubmit="createPost(event)" style="margin-bottom:18px;">
        <input id="post-title" type="text" placeholder="제목" required style="width:200px;">
        <textarea id="post-content" placeholder="내용" required rows="2" style="width:60%;"></textarea>
        <button class="btn" type="submit">글쓰기</button>
      </form>
      <div id="posts-list"></div>
    </div>

    <!-- 프로필 -->
    <div id="profile-page" class="profile-box hidden">
      <h3>프로필</h3>
      <div>
        <label>현재 닉네임</label>
        <div style="margin-bottom:10px;"><b id="profile-nick-display">-</b></div>
        <label for="profile-nickname">닉네임 변경</label>
        <input id="profile-nickname" type="text" style="width:200px;">
        <button class="btn" onclick="changeNickname()">변경</button>
      </div>
      <div id="profile-msg" class="info"></div>
      <div id="profile-err" class="err"></div>
    </div>
  </div>

  <!-- 닉네임 설정 모달 (초기/변경) -->
  <div id="nick-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h4>닉네임 설정</h4>
      <div>
        <label for="modal-nick">사용할 닉네임</label>
        <input id="modal-nick" type="text" placeholder="닉네임 입력(2~20자)">
        <div id="modal-err" class="err"></div>
        <div style="margin-top:10px;">
          <button class="btn" onclick="applyNickname()">확인</button>
          <button class="btn" onclick="closeNickModal()" style="margin-left:8px;">취소</button>
        </div>
        <div style="margin-top:8px;color:#999;font-size:0.9em;">주의: 로그인이 없으므로 닉네임은 로컬 저장됩니다. 서버에서는 닉네임 문자열만 기록됩니다.</div>
      </div>
    </div>
  </div>

  <script>
    // Firebase 설정 (기존 키 유지)
    const firebaseConfig = {
      apiKey: "AIzaSyCC6MFueLsHU1oZnM0Q3mvm_sU_tMPie8c",
      authDomain: "gaysdogam.firebaseapp.com",
      projectId: "gaysdogam",
      storageBucket: "gaysdogam.firebasestorage.app",
      messagingSenderId: "505108692237",
      appId: "1:505108692237:web:1e7bf3d6f855db7b238444",
      measurementId: "G-MCNTRDN70C"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 유틸: HTML 이스케이프
    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
      });
    }

    // 로컬에서 닉네임 관리
    function getLocalNick() {
      return localStorage.getItem('nickname') || '';
    }
    function setLocalNick(nick) {
      localStorage.setItem('nickname', nick);
      renderNickname();
    }
    function clearLocalNick() {
      localStorage.removeItem('nickname');
      renderNickname();
    }

    // 페이지 전환
    function showPage(page) {
      document.getElementById('board-page').classList.add('hidden');
      document.getElementById('profile-page').classList.add('hidden');
      document.getElementById(page+'-page').classList.remove('hidden');
    }

    // 닉네임 모달 제어
    function showSetNick() {
      document.getElementById('modal-nick').value = getLocalNick();
      document.getElementById('modal-err').textContent = '';
      document.getElementById('nick-modal').classList.remove('hidden');
    }
    function closeNickModal() {
      document.getElementById('nick-modal').classList.add('hidden');
      // 닉네임이 없으면 모달 다시 띄움(초기 진입 케이스를 위해)
      if(!getLocalNick()) showSetNick();
    }
    function applyNickname() {
      const n = (document.getElementById('modal-nick').value || '').trim();
      const errEl = document.getElementById('modal-err');
      errEl.textContent = '';
      if(!n) { errEl.textContent = '닉네임을 입력하세요.'; return; }
      if(n.length < 2 || n.length > 20) { errEl.textContent = '닉네임은 2~20자여야 합니다.'; return; }
      // 허용 문자 간단 제약: 공백 제거
      if(/\s/.test(n)) { errEl.textContent = '공백을 포함할 수 없습니다.'; return; }

      setLocalNick(n);
      document.getElementById('nick-modal').classList.add('hidden');
    }

    // 초기화: 닉네임 없으면 모달 강제
    window.addEventListener('load', () => {
      renderNickname();
      loadPosts();
      if(!getLocalNick()) {
        // 강제로 닉네임 설정 모달 표시
        showSetNick();
      }
    });

    function renderNickname() {
      const nick = getLocalNick();
      document.getElementById('current-nickname').textContent = nick || '-';
      document.getElementById('profile-nick-display').textContent = nick || '-';
      document.getElementById('profile-nickname').value = nick || '';
    }

    // 닉네임 변경 from profile
    function changeNickname() {
      const newNick = (document.getElementById('profile-nickname').value || '').trim();
      const msg = document.getElementById('profile-msg');
      const err = document.getElementById('profile-err');
      msg.textContent = ''; err.textContent = '';
      if(!newNick) { err.textContent = '닉네임을 입력하세요.'; return; }
      if(newNick.length < 2 || newNick.length > 20) { err.textContent = '닉네임은 2~20자여야 합니다.'; return; }
      if(/\s/.test(newNick)) { err.textContent = '공백을 포함할 수 없습니다.'; return; }
      setLocalNick(newNick);
      msg.textContent = '닉네임이 변경되었습니다.';
      loadPosts(); // 게시글에 표시되는 닉네임은 기존 게시물은 변경되지 않음(서버 저장된 닉네임 그대로), 이후 작성글은 새 닉네임으로 저장됨
    }

    // 게시글 작성 (닉네임 필요)
    async function createPost(e) {
      e.preventDefault();
      const title = (document.getElementById('post-title').value || '').trim();
      const content = (document.getElementById('post-content').value || '').trim();
      const nick = getLocalNick();
      if(!nick) { alert('닉네임을 설정하세요.'); showSetNick(); return; }
      if(!title || !content) return;

      try {
        await db.collection('posts').add({
          title: title,
          content: content,
          nickname: nick,
          created: Date.now(),
          likes: [],
          comments: 0
        });
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        loadPosts();
      } catch (err) {
        console.error(err);
        alert('글 작성 실패');
      }
    }

    // 게시글 로드
    function loadPosts() {
      const postList = document.getElementById('posts-list');
      postList.innerHTML = '<i>불러오는 중...</i>';
      db.collection('posts').orderBy('created','desc').limit(50).get().then(snap=>{
        postList.innerHTML = '';
        if(snap.empty){ postList.innerHTML = '<i>게시글이 없습니다.</i>'; return; }
        snap.forEach(doc=>{
          const p = doc.data();
          postList.innerHTML += `
            <div class="board-post" id="post-${doc.id}">
              <div class="title">${escapeHtml(p.title)} <span style="font-size:0.8em;color:#aaa;">by ${escapeHtml(p.nickname||'익명')}</span></div>
              <div>${escapeHtml(p.content)}</div>
              <div>
                <button class="like-btn" onclick="toggleLike('${doc.id}', this)">&#128077; <span>${(p.likes && p.likes.length) || 0}</span></button>
                <span style="margin-left:20px;">댓글 ${p.comments||0}개</span>
                <button class="btn" style="margin-left:20px;" onclick="toggleComments('${doc.id}')">댓글 보기</button>
              </div>
              <div class="comments-box hidden" id="comments-${doc.id}">
                <form onsubmit="addComment(event, '${doc.id}')">
                  <input type="text" placeholder="댓글" id="comment-input-${doc.id}" required style="width:60%;">
                  <button class="btn" type="submit">작성</button>
                </form>
                <div class="comment-list" id="comment-list-${doc.id}"></div>
              </div>
            </div>
          `;
        });
      }).catch(e=>{ console.error(e); postList.innerHTML = '<i>불러오기 실패</i>'; });
    }

    // 좋아요 기능: 로컬닉네임 기반 토글 (중복 방지 위한 식별값으로 로컬닉 사용)
    async function toggleLike(postId, btn) {
      const nick = getLocalNick();
      if(!nick) { alert('닉네임을 설정하세요.'); showSetNick(); return; }
      const postRef = db.collection('posts').doc(postId);
      try {
        const doc = await postRef.get();
        if(!doc.exists) return;
        let likes = doc.data().likes || [];
        // likes 배열에는 닉네임을 저장(간단 구현). 동일 닉네임은 하나만 허용.
        const idx = likes.indexOf(nick);
        if(idx === -1) likes.push(nick);
        else likes.splice(idx,1);
        await postRef.update({ likes });
        // UI 업데이트
        const span = btn.querySelector('span');
        if(span) span.textContent = likes.length;
        btn.classList.toggle('liked', idx === -1);
      } catch(e) { console.error(e); }
    }

    // 댓글 보기/숨기기
    function toggleComments(postId) {
      const box = document.getElementById('comments-'+postId);
      if(box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        loadComments(postId);
      } else {
        box.classList.add('hidden');
      }
    }

    // 댓글 불러오기
    function loadComments(postId) {
      const list = document.getElementById('comment-list-'+postId);
      db.collection('posts').doc(postId).collection('comments').orderBy('created').get().then(snap=>{
        list.innerHTML = '';
        snap.forEach(doc=>{
          const c = doc.data();
          list.innerHTML += `<div class="comment"><b>${escapeHtml(c.nickname)}</b>: ${escapeHtml(c.text)}</div>`;
        });
      }).catch(e=>{ console.error(e); list.innerHTML = '<i>댓글 불러오기 실패</i>'; });
    }

    // 댓글 작성
    async function addComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('comment-input-'+postId);
      const text = (input.value || '').trim();
      const nick = getLocalNick();
      if(!nick) { alert('닉네임을 설정하세요.'); showSetNick(); return; }
      if(!text) return;
      try {
        await db.collection('posts').doc(postId).collection('comments').add({
          uid: null,
          nickname: nick,
          text: text,
          created: Date.now()
        });
        input.value = '';
        // 댓글 수 증가
        await db.collection('posts').doc(postId).update({ comments: firebase.firestore.FieldValue.increment(1) });
        loadComments(postId);
        loadPosts();
      } catch(e) {
        console.error(e);
        alert('댓글 작성 실패');
      }
    }
  </script>
</body>
</html>

  </script>
</body>
</html>

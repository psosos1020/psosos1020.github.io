<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ACP 재단 - Azoral Contain Porn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { background: #222; color: #eee; font-family: 'Malgun Gothic', Arial, sans-serif; margin:0; }
    header { background:#111; padding:24px 0 10px; text-align:center; border-bottom:4px solid #f44;}
    header h1{ margin:0; font-size:2.3em; }
    header h2{ margin:11px 0 0 0; color:#f44; font-size:1.1em;}
    .container { max-width:900px; margin:30px auto; padding:24px; background:#292929; border-radius:8px; }
    .hidden { display:none; }
    nav { background:#191919; padding:7px 0; text-align:center; border-bottom:2px solid #444; }
    nav button { background:none; border:none; color:#f44; margin:0 10px; font-size:1.1em; cursor:pointer; }
    .board-post, .comment { background:#181818; margin:18px 0; padding:14px 12px; border-left:5px solid #f44; border-radius:6px; }
    .board-post .title { font-size:1.18em; color:#fff; margin-bottom:7px;}
    .like-btn { cursor:pointer; color:#f44; background: none; border: none; font-size:1.1em;}
    .like-btn.liked { color:#ffd700; }
    .comment { margin-left: 30px; border-left: 3px solid #4af; }
    .profile-box { margin:20px 0; padding:15px; background:#181818; border-radius:8px;}
    input, textarea { background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:6px 8px; margin-bottom:8px;}
    .login-box, .signup-box { margin:30px auto 0 auto; max-width:350px; background:#191919; padding:20px 22px; border-radius:10px;}
    .btn { background:#f44; color:#fff; border:none; padding:7px 15px; border-radius:5px; cursor:pointer;}
    .btn:disabled { background:#555; }
    .err { color:#f44; margin:7px 0;}
    .info { color:#4af; margin:7px 0;}
    label { display:block; margin-bottom:6px; color:#ddd; font-size:0.95em;}
  </style>
</head>
<body>
  <header>
    <h1>ACP 재단</h1>
    <h2>아조랄, 격리, 포르노</h2>
  </header>
  <nav id="navbar" class="hidden">
    <button onclick="showPage('board')">게시판</button>
    <button onclick="showPage('profile')">프로필</button>
    <button onclick="logout()">로그아웃</button>
  </nav>
  <div class="container">
    <!-- 로그인/회원가입 -->
    <div id="login-page" class="login-box">
      <h3>로그인</h3>
      <div>
        <label for="login-nickname">닉네임</label>
        <input id="login-nickname" type="text" placeholder="닉네임" required><br>
        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" placeholder="비밀번호" required><br>
        <button class="btn" onclick="login()">로그인</button>
        <button class="btn" onclick="showSignup()">회원가입</button>
      </div>
      <div id="login-error" class="err"></div>
    </div>

    <div id="signup-page" class="signup-box hidden">
      <h3>회원가입</h3>
      <div>
        <label for="signup-nickname">닉네임</label>
        <input id="signup-nickname" type="text" placeholder="닉네임" required><br>
        <label for="signup-password">비밀번호</label>
        <input id="signup-password" type="password" placeholder="비밀번호" required><br>
        <button class="btn" onclick="signup()">가입하기</button>
        <button class="btn" onclick="showLogin()">뒤로가기</button>
      </div>
      <div id="signup-error" class="err"></div>
      <div id="signup-info" class="info">닉네임은 중복 불가합니다.</div>
    </div>

    <!-- 게시판 -->
    <div id="board-page" class="hidden">
      <h3>게시판</h3>
      <form id="post-form" onsubmit="createPost(event)" style="margin-bottom:18px;">
        <input id="post-title" type="text" placeholder="제목" required style="width:200px;">
        <textarea id="post-content" placeholder="내용" required rows="2" style="width:60%;"></textarea>
        <button class="btn" type="submit">글쓰기</button>
      </form>
      <div id="posts-list"></div>
    </div>

    <!-- 프로필 -->
    <div id="profile-page" class="profile-box hidden">
      <h3>프로필</h3>
      <div>
        <b>회원ID(uid):</b> <span id="profile-uid"></span><br><br>
        <label for="profile-nickname">닉네임</label>
        <input id="profile-nickname" type="text" style="width:140px;">
        <button class="btn" onclick="updateProfile()">수정</button><br>
        <label for="profile-bio">자기소개</label>
        <textarea id="profile-bio" rows="2" style="width:70%;"></textarea>
        <button class="btn" onclick="updateProfile()">수정</button>
      </div>
      <div id="profile-update-msg" style="color:#4af;"></div>
      <div id="profile-error" class="err"></div>
    </div>
  </div>

  <!-- Firebase 및 기능 스크립트 -->
  <script>
    // Firebase 설정 (기존 키 유지)
    const firebaseConfig = {
      apiKey: "AIzaSyCC6MFueLsHU1oZnM0Q3mvm_sU_tMPie8c",
      authDomain: "gaysdogam.firebaseapp.com",
      projectId: "gaysdogam",
      storageBucket: "gaysdogam.firebasestorage.app",
      messagingSenderId: "505108692237",
      appId: "1:505108692237:web:1e7bf3d6f855db7b238444",
      measurementId: "G-MCNTRDN70C"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 페이지 전환
    function showPage(page) {
      document.getElementById('board-page').classList.add('hidden');
      document.getElementById('profile-page').classList.add('hidden');
      if(page==='board') loadPosts();
      if(page==='profile') loadProfile();
      document.getElementById(page+'-page').classList.remove('hidden');
    }
    function showSignup() {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('signup-page').classList.remove('hidden');
    }
    function showLogin() {
      document.getElementById('signup-page').classList.add('hidden');
      document.getElementById('login-page').classList.remove('hidden');
    }

    // 로그아웃
    function logout() {
      firebase.auth().signOut();
    }

    // 로그인 (닉네임 + 비밀번호)
    async function login() {
      document.getElementById('login-error').textContent = '';
      const nick = (document.getElementById('login-nickname').value || '').trim();
      const pw = (document.getElementById('login-password').value || '').trim();
      if(!nick || !pw) { document.getElementById('login-error').textContent = '닉네임과 비밀번호를 입력하세요.'; return; }

      try {
        // 닉네임 -> uid 조회
        const snap = await db.collection('users').where('nickname', '==', nick).limit(1).get();
        if(snap.empty) { document.getElementById('login-error').textContent = '존재하지 않는 닉네임입니다.'; return; }
        const uid = snap.docs[0].id;
        const authEmail = `${uid}@local.auth`;
        await firebase.auth().signInWithEmailAndPassword(authEmail, pw);
        // 성공 시 onAuthStateChanged가 처리
      } catch(e) {
        console.error(e);
        document.getElementById('login-error').textContent = '로그인 실패: 비밀번호를 확인하세요.';
      }
    }

    // 회원가입 (닉네임 + 비밀번호)
    async function signup() {
      document.getElementById('signup-error').textContent = '';
      const nick = (document.getElementById('signup-nickname').value || '').trim();
      const pw = (document.getElementById('signup-password').value || '').trim();
      if(!nick || !pw) { document.getElementById('signup-error').textContent = '닉네임과 비밀번호를 입력하세요.'; return; }
      if(nick.length < 2 || nick.length > 20) { document.getElementById('signup-error').textContent = '닉네임은 2~20자여야 합니다.'; return; }
      if(pw.length < 6) { document.getElementById('signup-error').textContent = '비밀번호는 최소 6자여야 합니다.'; return; }

      try {
        // 중복 검사
        const existing = await db.collection('users').where('nickname', '==', nick).limit(1).get();
        if(!existing.empty) { document.getElementById('signup-error').textContent = '이미 사용 중인 닉네임입니다.'; return; }

        // 임시 이메일로 사용자 생성
        const tempEmail = `${Date.now()}_${Math.random().toString(36).slice(2,10)}@local.auth`;
        const userCred = await firebase.auth().createUserWithEmailAndPassword(tempEmail, pw);
        const uid = userCred.user.uid;
        const finalEmail = `${uid}@local.auth`;

        // 이메일을 uid 기반으로 업데이트 (현재 로그인되어 있으므로 가 능)
        await userCred.user.updateEmail(finalEmail);

        // users 문서 생성: doc id = uid
        await db.collection('users').doc(uid).set({
          nickname: nick,
          email: finalEmail,
          bio: ''
        });

        // 로그아웃 시켜서 사용자가 로그인 페이지에서 로그인하도록 유도 (선택사항)
        await firebase.auth().signOut();
        showLogin();
        alert('회원가입 완료! 로그인하세요.');
      } catch(e) {
        console.error(e);
        // 친절한 메시지 제공
        if(e.code === 'auth/email-already-in-use') {
          document.getElementById('signup-error').textContent = '이미 사용 중인 계정입니다.';
        } else {
          document.getElementById('signup-error').textContent = '회원가입 실패: ' + (e.message || '');
        }
      }
    }

    // 인증 상태 변경 감지
    firebase.auth().onAuthStateChanged(user=>{
      if(user){
        // 로그인 성공
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('signup-page').classList.add('hidden');
        document.getElementById('navbar').classList.remove('hidden');
        showPage('board');
      }else{
        document.getElementById('navbar').classList.add('hidden');
        document.getElementById('board-page').classList.add('hidden');
        document.getElementById('profile-page').classList.add('hidden');
        document.getElementById('login-page').classList.remove('hidden');
      }
    });

    // 게시판: 글 작성
    async function createPost(e) {
      e.preventDefault();
      const title = (document.getElementById('post-title').value || '').trim();
      const content = (document.getElementById('post-content').value || '').trim();
      if(!title || !content) return;
      const user = firebase.auth().currentUser;
      if(!user) { alert('로그인이 필요합니다.'); return; }

      try {
        const doc = await db.collection('users').doc(user.uid).get();
        const nick = doc.exists ? doc.data().nickname : '익명';
        await db.collection('posts').add({
          title, content, uid:user.uid, nickname:nick, created:Date.now(), likes:[], comments:0
        });
        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        loadPosts();
      } catch(e) {
        console.error(e);
        alert('글 작성 중 오류가 발생했습니다.');
      }
    }

    // 게시판: 글 목록 불러오기
    function loadPosts() {
      const postList = document.getElementById('posts-list');
      postList.innerHTML = '<i>불러오는 중...</i>';
      db.collection('posts').orderBy('created','desc').limit(30).get().then(snap=>{
        postList.innerHTML = '';
        if(snap.empty){ postList.innerHTML = '<i>게시글이 없습니다.</i>'; return; }
        snap.forEach(doc=>{
          const p = doc.data();
          postList.innerHTML += `
          <div class="board-post" id="post-${doc.id}">
            <div class="title">${escapeHtml(p.title)} <span style="font-size:0.8em;color:#aaa;">by ${escapeHtml(p.nickname)}</span></div>
            <div>${escapeHtml(p.content)}</div>
            <div>
              <button class="like-btn" onclick="toggleLike('${doc.id}', this)">&#128077; <span>${(p.likes && p.likes.length) || 0}</span></button>
              <span style="margin-left:20px;">댓글 ${p.comments||0}개</span>
              <button class="btn" style="margin-left:20px;" onclick="toggleComments('${doc.id}')">댓글 보기</button>
            </div>
            <div class="comments-box hidden" id="comments-${doc.id}">
              <form onsubmit="addComment(event, '${doc.id}')">
                <input type="text" placeholder="댓글" id="comment-input-${doc.id}" required style="width:60%;">
                <button class="btn" type="submit">작성</button>
              </form>
              <div class="comment-list" id="comment-list-${doc.id}"></div>
            </div>
          </div>`;
          setTimeout(()=>updateLikeBtn(doc.id, p.likes),100);
        });
      }).catch(e=>{ console.error(e); postList.innerHTML = '<i>불러오기 실패</i>'; });
    }

    // 좋아요 기능
    async function toggleLike(postId, btn) {
      const user = firebase.auth().currentUser;
      if(!user) { alert('로그인이 필요합니다.'); return; }
      const postRef = db.collection('posts').doc(postId);
      try {
        const doc = await postRef.get();
        if(!doc.exists) return;
        let likes = doc.data().likes || [];
        const idx = likes.indexOf(user.uid);
        if(idx===-1) likes.push(user.uid);
        else likes.splice(idx,1);
        await postRef.update({likes});
        updateLikeBtn(postId, likes);
        if(btn && btn.querySelector) {
          const span = btn.querySelector('span');
          if(span) span.textContent = likes.length;
        }
      } catch(e) { console.error(e); }
    }
    function updateLikeBtn(postId, likes) {
      const user = firebase.auth().currentUser;
      const btn = document.querySelector(`#post-${postId} .like-btn`);
      if(btn && user) btn.classList.toggle('liked', (likes||[]).includes(user.uid));
    }

    // 댓글 보기/숨기기
    function toggleComments(postId) {
      const box = document.getElementById('comments-'+postId);
      if(box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        loadComments(postId);
      } else {
        box.classList.add('hidden');
      }
    }
    // 댓글 불러오기
    function loadComments(postId) {
      const list = document.getElementById('comment-list-'+postId);
      db.collection('posts').doc(postId).collection('comments')
        .orderBy('created').get().then(snap=>{
        list.innerHTML = '';
        snap.forEach(doc=>{
          const c = doc.data();
          list.innerHTML += `<div class="comment"><b>${escapeHtml(c.nickname)}</b>: ${escapeHtml(c.text)}</div>`;
        });
      }).catch(e=>{ console.error(e); list.innerHTML = '<i>댓글 불러오기 실패</i>'; });
    }
    // 댓글 작성
    async function addComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById('comment-input-'+postId);
      const text = (input.value || '').trim();
      if(!text) return;
      const user = firebase.auth().currentUser;
      if(!user) { alert('로그인이 필요합니다.'); return; }
      try {
        const doc = await db.collection('users').doc(user.uid).get();
        const nick = doc.exists ? doc.data().nickname : '익명';
        await db.collection('posts').doc(postId).collection('comments').add({
          uid:user.uid, nickname:nick, text, created:Date.now()
        });
        input.value = '';
        // 댓글 수 증가
        const postRef = db.collection('posts').doc(postId);
        await postRef.update({comments:firebase.firestore.FieldValue.increment(1)});
        loadComments(postId);
        loadPosts();
      } catch(e) {
        console.error(e);
        alert('댓글 작성 실패');
      }
    }

    // 프로필 보기 및 수정
    function loadProfile() {
      const user = firebase.auth().currentUser;
      if(!user) return;
      document.getElementById('profile-uid').textContent = user.uid;
      db.collection('users').doc(user.uid).get().then(doc=>{
        const d = doc.exists ? doc.data() : {};
        document.getElementById('profile-nickname').value = d.nickname || '';
        document.getElementById('profile-bio').value = d.bio || '';
      }).catch(e=>{ console.error(e); document.getElementById('profile-error').textContent='프로필 로드 실패';});
      document.getElementById('profile-update-msg').textContent = '';
      document.getElementById('profile-error').textContent = '';
    }

    async function updateProfile() {
      document.getElementById('profile-update-msg').textContent = '';
      document.getElementById('profile-error').textContent = '';
      const user = firebase.auth().currentUser;
      if(!user) { document.getElementById('profile-error').textContent='로그인이 필요합니다.'; return; }
      const nickname = (document.getElementById('profile-nickname').value || '').trim();
      const bio = (document.getElementById('profile-bio').value || '').trim();
      if(!nickname) { document.getElementById('profile-error').textContent='닉네임을 입력하세요.'; return; }
      if(nickname.length < 2 || nickname.length > 20) { document.getElementById('profile-error').textContent='닉네임은 2~20자여야 합니다.'; return; }

      try {
        // 닉네임을 다른 사용자가 쓰고 있는지 검사 (허용되는 경우: 본인 닉네임)
        const snap = await db.collection('users').where('nickname', '==', nickname).limit(1).get();
        if(!snap.empty && snap.docs[0].id !== user.uid) {
          document.getElementById('profile-error').textContent = '이미 사용 중인 닉네임입니다.';
          return;
        }
        await db.collection('users').doc(user.uid).update({nickname, bio});
        document.getElementById('profile-update-msg').textContent = '저장되었습니다.';
        loadPosts();
      } catch(e) {
        console.error(e);
        document.getElementById('profile-error').textContent = '프로필 저장 실패';
      }
    }

    // HTML 이스케이프
    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
      });
    }
  </script>
</body>
</html>

  </script>
</body>
</html>

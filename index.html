<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>쌌도르 ai</title>
  <style>
    body{font-family:Inter,system-ui,Arial,Helvetica,sans-serif;margin:20px;background:#f7f9fb}
    .card{max-width:900px;margin:0 auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(12,34,56,.06)}
    input, textarea, button, select{font-size:14px;padding:8px;border:1px solid #ddd;border-radius:8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    textarea{min-height:72px;flex:1}
    #log{white-space:pre-wrap;background:#fafafa;padding:12px;border-radius:8px;border:1px solid #eee;max-height:360px;overflow:auto}
    small{color:#666}
  </style>
</head>
<body>
  <div class="card">
    <h2>똥쌌도르</h2>

    <div class="row">
      <input id="hfToken" type="password" placeholder="HF 토큰 (Bearer)" style="min-width:420px" />
      <select id="model">
        <option value="MLP-KTLim/llama-3-Korean-Bllossom-8B:featherless-ai">MLP-KTLim/llama-3-Korean-Bllossom-8B</option>
        <option value="gpt2"</option>
      </select>
      <button id="save">토큰 저장</button>
      <button id="clear">토큰 삭제</button>
    </div>

    <div class="row">
      <textarea id="prompt">What is the capital of France?</textarea>
      <button id="send">보내기</button>
    </div>

    <div id="log"></div>

    <p><small>뭐 인마</small></p>
  </div>

  <script>
    const hfInput = document.getElementById('hfToken');
    const saveBtn = document.getElementById('save');
    const clearBtn = document.getElementById('clear');
    const modelSel = document.getElementById('model');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const log = document.getElementById('log');

    // 로컬 스토리지에 토큰/모델 저장 (사용자 동의 필요)
    hfInput.value = localStorage.getItem('HF_TOKEN') || '';
    modelSel.value = localStorage.getItem('HF_MODEL') || modelSel.value;

    saveBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!hfInput.value.trim()) return alert('토큰을 입력하세요.');
      localStorage.setItem('HF_TOKEN', hfInput.value.trim());
      localStorage.setItem('HF_MODEL', modelSel.value);
      alert('토큰 저장됨 (localStorage).');
    });

    clearBtn.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('HF_TOKEN');
      hfInput.value = '';
      alert('토큰 삭제됨.');
    });

    function appendLine(text) {
      log.textContent += text + '\n';
      log.scrollTop = log.scrollHeight;
    }

    // 핵심: OpenAI JS 예제와 동일한 동작을 fetch로 구현
    async function sendPrompt() {
      const HF_TOKEN = localStorage.getItem('HF_TOKEN') || hfInput.value.trim();
      if (!HF_TOKEN) return alert('HF 토큰이 필요합니다.');

      const model = modelSel.value;
      const userText = promptEl.value.trim();
      if (!userText) return;

      appendLine('> 사용자: ' + userText);
      appendLine('...요청 중 (Hugging Face Router)');

      const payload = {
        model: model,
        messages: [
          { role: "user", content: userText }
        ],
        max_tokens: 512,
        temperature: 0.2
      };

      try {
        const res = await fetch('https://router.huggingface.co/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + HF_TOKEN
          },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const text = await res.text().catch(() => res.statusText);
          appendLine(`[HTTP ${res.status}] 오류 응답: ${text}`);
          console.error('응답 본문:', text);
          return;
        }

        const data = await res.json();

        // 원래 Node 코드에서 console.log(chatCompletion.choices[0].message);
        // 동일하게 안전하게 파싱해서 출력
        const choiceMessage = data?.choices?.[0]?.message ?? data?.choices?.[0]?.text ?? null;

        appendLine('응답 원시 JSON:');
        appendLine(JSON.stringify(data, null, 2));
        appendLine('----');

        appendLine('parsed (chatCompletion.choices[0].message):');
        appendLine(choiceMessage ? JSON.stringify(choiceMessage, null, 2) : '응답에서 message 필드를 찾을 수 없음');

        // 콘솔에도 동일한 형태로 출력 (요청하신대로)
        console.log('chatCompletion (choices[0].message):', choiceMessage);
      } catch (err) {
        appendLine('요청 실패: ' + err.message);
        console.error(err);
      }
    }

    sendBtn.addEventListener('click', (e) => {
      e.preventDefault();
      sendPrompt();
    });

    // Enter만으로 보내기 (Ctrl+Enter 사용 권장)
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendPrompt();
      }
    });

    // 안내: 로컬 파일로 열면 일부 브라우저에서 CORS나 mixed content 문제 발생 가능.
    // 권장: 간단한 정적 서버로 제공
    // python -m http.server 8000
    // 또는 VSCode Live Server 사용
  </script>
</body>
</html>

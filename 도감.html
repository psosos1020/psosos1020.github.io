<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>게이들 도감</title>
<style>
  :root { --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --accent:#06b6d4; --ok:#10b981; --danger:#ef4444; --glass: rgba(255,255,255,0.03); }
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic";background:linear-gradient(180deg,#071024,#041026);color:#e6eef6}
  .container{max-width:1100px;margin:28px auto;padding:18px}
  h1{margin:0 0 12px;font-size:20px}
  /* .layout{display:grid;grid-template-columns:1fr 380px;gap:18px} */ /* 2단 레이아웃 비활성; 필요시 복구 */
  .layout{display:block;}
  .card{background:var(--card);padding:14px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
  label{display:block;margin:10px 0 6px;color:var(--muted);font-size:13px}
  input[type=text], textarea, select {width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
  textarea{min-height:90px;resize:vertical}
  button{padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:#021124;font-weight:700;cursor:pointer}
  .muted{color:var(--muted);font-size:13px}
  .small{font-size:13px}
  .preview{border-radius:8px;overflow:hidden;background:var(--glass);padding:8px}
  .entry-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
  .entry{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);padding:10px;border-radius:10px}
  .entry img{width:100%;height:140px;object-fit:cover;border-radius:6px}
  .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:rgba(255,255,255,0.04);padding:4px 8px;border-radius:6px;font-size:12px;color:var(--muted)}
  .meta{margin-top:8px;color:var(--muted);font-size:13px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .small-muted{font-size:12px;color:var(--muted)}
  .search{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .search input{flex:1}
  footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
  /* 추가: btn-ghost 버튼 스타일 */
  .btn-ghost { background: none; color: var(--muted); border: 1px solid rgba(255,255,255,0.15); font-weight: normal; transition: background 0.2s; }
  .btn-ghost:hover { background: var(--glass); color: var(--accent);}
  .btn-ghost:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <header class="card" style="margin-bottom:12px">
    <h1>게이 도감</h1>
    <div class="muted small">게이를 등록할 수 있는 사이트</div>
  </header>

  <div class="layout">
    <!-- left: submission + entries -->
    <div>
      <div class="card" id="submitCard">
        <h2>새 게이 만들기</h2>
        <label for="title">이름</label>
        <input id="title" type="text" placeholder="항목 이름" />
        <label for="desc">설명</label>
        <textarea id="desc" placeholder="항목 설명 (간단히)"></textarea>
        <label>속성 추가 (키:값)</label>
        <div style="display:flex;gap:8px">
          <input id="statKey" type="text" placeholder="키 (예: 게이력)" />
          <input id="statVal" type="text" placeholder="값 (예: 50)" />
          <button id="addStatBtn" type="button">추가</button>
        </div>
        <div id="statsContainer" class="small-muted" style="margin-top:8px"></div>

        <label for="tags">태그 (쉼표로 구분)</label>
        <input id="tags" type="text" placeholder="예: 어패류,류광원" />

        <label for="img">이미지 (선택)</label>
        <input id="img" type="file" accept="image/*" />
        <div class="preview" style="margin-top:8px">
          <div class="muted small">미리보기</div>
          <img id="imgPreview" src="" alt="" style="width:100%;height:200px;object-fit:contain;border-radius:8px;display:none;margin-top:8px" />
        </div>

        <div class="controls">
          <button id="submitBtn" type="button">제출</button>
          <button id="clearForm" class="btn-ghost" type="button">폼 초기화</button>
          <div class="small-muted">제출하면 바로 공개됩니다.</div>
        </div>

        <div id="submitMsg" class="small-muted" style="margin-top:10px"></div>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2>도감 항목</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="small-muted">총 항목: <span id="entriesCount">0</span></div>
          </div>
        </div>

        <div class="hr"></div>

        <div class="search">
          <input id="searchInput" type="text" placeholder="검색 (이름/태그)" />
          <button id="clearFilter" class="btn-ghost" type="button">초기화</button>
        </div>

        <div id="entries" class="entry-list"></div>
      </div>
    </div>
  </div>

  <footer>
    내부 테스트용 도감 시스템 — 제출 시 바로 공개됩니다.
  </footer>
</div>

<script>
const SUB_KEY = 'catalog_entries_v1';
const MAX_TITLE = 80;
const MAX_DESC = 2000;

let currentStats = {};
let cachedEntries = [];
try {
  cachedEntries = JSON.parse(localStorage.getItem(SUB_KEY) || '[]');
} catch(e) {
  cachedEntries = [];
}

/* DOM */
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const statKeyEl = document.getElementById('statKey');
const statValEl = document.getElementById('statVal');
const addStatBtn = document.getElementById('addStatBtn');
const statsContainer = document.getElementById('statsContainer');
const tagsEl = document.getElementById('tags');
const imgInput = document.getElementById('img');
const imgPreview = document.getElementById('imgPreview');
const submitBtn = document.getElementById('submitBtn');
const clearFormBtn = document.getElementById('clearForm');
const submitMsg = document.getElementById('submitMsg');
const entriesContainer = document.getElementById('entries');
const entriesCount = document.getElementById('entriesCount');
const searchInput = document.getElementById('searchInput');
const clearFilter = document.getElementById('clearFilter');

/* 이미지 미리보기 */
imgInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) { imgPreview.style.display='none'; imgPreview.src=''; return; }
  const reader = new FileReader();
  reader.onload = () => { imgPreview.src = reader.result; imgPreview.style.display='block'; };
  reader.readAsDataURL(f);
});

/* 속성 추가 */
addStatBtn.addEventListener('click', () => {
  const k = (statKeyEl.value || '').trim();
  const v = (statValEl.value || '').trim();
  if (!k) return alert('키를 입력하세요.');
  currentStats[k] = v;
  renderStats();
  statKeyEl.value = ''; statValEl.value = '';
});
function renderStats(){
  const ks = Object.keys(currentStats);
  if (!ks.length) { statsContainer.textContent='속성 없음'; return; }
  statsContainer.innerHTML = ks.map(k => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><strong style="width:100px">${k}</strong><div class="small-muted">${currentStats[k]}</div><button class="btn-ghost" data-rem="${k}" type="button" style="margin-left:auto">삭제</button></div>`).join('');
  Array.from(statsContainer.querySelectorAll('[data-rem]')).forEach(btn => btn.onclick = () => { delete currentStats[btn.dataset.rem]; renderStats(); });
}

/* 제출 처리 */
submitBtn.addEventListener('click', async () => {
  if (submitBtn.disabled) return;
  submitBtn.disabled = true;
  submitMsg.textContent = '';

  const title = (titleEl.value||'').trim();
  const desc = (descEl.value||'').trim();
  const tags = (tagsEl.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if (!title) { alert('이름을 입력하십시오.'); submitBtn.disabled = false; return; }
  if (title.length > MAX_TITLE) { alert('이름이 너무 깁니다.'); submitBtn.disabled = false; return; }
  if (desc.length > MAX_DESC) { alert('설명이 너무 깁니다.'); submitBtn.disabled = false; return; }

  let imageData = '';
  if (imgInput.files && imgInput.files[0]) {
    imageData = await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.readAsDataURL(imgInput.files[0]);
    });
  }

  const entry = { id:'e_'+Math.random().toString(36).slice(2,10), title, desc, tags, stats:{...currentStats}, imageDataURL:imageData, approvedAt:Date.now() };
  cachedEntries.unshift(entry);
  try {
    localStorage.setItem(SUB_KEY, JSON.stringify(cachedEntries));
    submitMsg.textContent = '제출 완료 — 공개됨';
    clearFormData();
    renderEntries();
  } catch(e) {
    alert('저장 실패(로컬스토리지 용량 초과 등).');
  }
  submitBtn.disabled = false;
});

/* 폼 초기화 */
clearFormBtn.addEventListener('click', clearFormData);
function clearFormData(){ titleEl.value=''; descEl.value=''; tagsEl.value=''; imgInput.value=''; imgPreview.src=''; imgPreview.style.display='none'; currentStats={}; renderStats(); }

/* 렌더링 */
function renderEntries() {
  entriesContainer.innerHTML='';
  const q = (searchInput.value||'').trim().toLowerCase();
  let items = cachedEntries.slice();
  if (q) items = items.filter(it => (it.title||'').toLowerCase().includes(q) || (it.tags||[]).some(t=>t.toLowerCase().includes(q)) || (it.desc||'').toLowerCase().includes(q));
  entriesCount.textContent = items.length;
  if (!items.length){ entriesContainer.innerHTML='<div class="muted small">표시할 항목이 없습니다.</div>'; return; }
  for (const it of items){
    const div = document.createElement('div'); div.className='entry';
    const imgHtml = it.imageDataURL? `<img src="${it.imageDataURL}" alt="img"/>`:`<div style="width:100%;height:140px;border-radius:6px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;color:var(--muted)">이미지 없음</div>`;
    div.innerHTML=`${imgHtml}<h3 style="margin:8px 0 4px;font-size:16px">${escapeHtml(it.title)}</h3><div class="meta">${escapeHtml(sliceText(it.desc,140))}</div><div class="tags">${(it.tags||[]).map(t=>`<div class="tag">${escapeHtml(t)}</div>`).join('')}</div><div class="meta" style="margin-top:8px">${renderStatsInline(it.stats)}</div>`;
    entriesContainer.appendChild(div);
  }
}

/* 보조 */
function sliceText(s,n){if(!s)return''; return s.length>n?s.slice(0,n-1)+'…':s;}
function escapeHtml(s){if(!s)return''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderStatsInline(obj){if(!obj)return''; return Object.entries(obj).map(([k,v])=>`${escapeHtml(k)}: ${escapeHtml(v)}`).join(' · ');}

/* 검색 */
searchInput.addEventListener('input', renderEntries);
clearFilter.addEventListener('click', ()=>{ searchInput.value=''; renderEntries(); });

renderStats();
renderEntries();
</script>
</body>
</html>
